// live preview in a browser: ?t=12.3 to freeze, otherwise plays in real time
(async () => { await window.ready; const q = new URLSearchParams(location.search); if (!navigator.webdriver) { if (q.has('t')) render(+q.get('t')); else { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % META.DUR); requestAnimationFrame(loop); }; loop(); } } })();
